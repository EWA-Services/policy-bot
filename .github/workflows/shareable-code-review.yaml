# Public fork repositories receive byte-for-byte copies of this file through
# sync/bundles/workflow-public-fork-code-review.yml. Edit the source in
# EWA-Services/EWA-Actions; edits made in a fork copy are overwritten.
# Reusable Direct CLI Code Review Workflow
#
# yamllint disable rule:line-length
---
name: Code Review

on:
  workflow_call:
    inputs:
      actions_ref:
        description: EWA-Actions ref to check out for CI helper scripts
        required: false
        default: main
        type: string
      runner:
        description: Runner label for review jobs; public repositories need a GitHub-hosted runner
        required: false
        default: finn-runners
        type: string
      pr_number:
        description: Pull request number to review
        required: false
        default: ""
        type: string
      comment_body:
        description: Exact slash command forwarded by repository dispatch
        required: false
        default: ""
        type: string
      comment_author:
        description: Actor forwarded by repository dispatch
        required: false
        default: manual-dispatch
        type: string
      comment_id:
        description: Slash-command comment identifier
        required: false
        default: ""
        type: string
      ai_review_override_approvers:
        description: GitHub logins allowed to override AI review
        required: false
        default: jai
        type: string
      dispatch_command:
        description: Command name forwarded by Slash Command Dispatch
        required: false
        default: ""
        type: string
      dispatch_issue_state:
        description: Pull-request state forwarded by Slash Command Dispatch
        required: false
        default: ""
        type: string
      dispatch_event_action:
        description: Comment action forwarded by Slash Command Dispatch
        required: false
        default: ""
        type: string
      dispatch_previous_body:
        description: Previous comment body forwarded for edit events
        required: false
        default: ""
        type: string
      codex_version:
        description: Codex CLI version to install for direct CLI runs (latest or exact semver)
        required: false
        default: latest
        type: string
      codex_model:
        description: Codex model to use for direct CLI runs
        required: false
        default: gpt-6-astra
        type: string
      codex_reasoning_effort:
        description: Codex reasoning effort for direct CLI runs (none|low|medium|high|xhigh)
        required: false
        default: high
        type: string
    secrets:
      FINN_DEVOPS_PERSONAL_ACCESS_TOKEN:
        required: true
      LINEAR_API_KEY:
        required: false
      TYPESAFE_API_KEY:
        required: false
      CODEX_AUTH_JSON:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false # Accepted until downstream caller sync removes it.
      CLAUDE_CODE_OAUTH_TOKEN_2:
        required: false
      CODEX_AUTH_ALERT_WEBHOOK_URL:
        required: false
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY:
        required: false
      AI_REVIEW_TELEMETRY_SUPABASE_URL:
        required: false
      AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY:
        required: false

permissions: {}

jobs:
  v1:
    if: vars.AI_REVIEW_VERSION == '' || vars.AI_REVIEW_VERSION == '1'
    uses: ./.github/workflows/shareable-code-review-pipeline.yaml
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    with:
      review_version: "1"
      actions_ref: ${{ inputs.actions_ref }}
      runner: ${{ inputs.runner }}
      pr_number: ${{ inputs.pr_number }}
      comment_body: ${{ inputs.comment_body }}
      comment_author: ${{ inputs.comment_author }}
      comment_id: ${{ inputs.comment_id }}
      ai_review_override_approvers: ${{ inputs.ai_review_override_approvers }}
      dispatch_command: ${{ inputs.dispatch_command }}
      dispatch_issue_state: ${{ inputs.dispatch_issue_state }}
      dispatch_event_action: ${{ inputs.dispatch_event_action }}
      dispatch_previous_body: ${{ inputs.dispatch_previous_body }}
      codex_version: ${{ inputs.codex_version }}
      codex_model: ${{ inputs.codex_model }}
      codex_reasoning_effort: ${{ inputs.codex_reasoning_effort }}
    secrets:
      FINN_DEVOPS_PERSONAL_ACCESS_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_AUTH_ALERT_WEBHOOK_URL: ${{ secrets.CODEX_AUTH_ALERT_WEBHOOK_URL }}
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
      AI_REVIEW_TELEMETRY_SUPABASE_URL: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL }}
      AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY }}

  v2:
    if: >-
      vars.AI_REVIEW_VERSION == '2' ||
      ((vars.AI_REVIEW_VERSION == '3' || vars.AI_REVIEW_VERSION == '4' || vars.AI_REVIEW_VERSION == '5') &&
        (github.event_name == 'issue_comment' ||
         github.event_name == 'pull_request_review_comment'))
    uses: ./.github/workflows/shareable-code-review-v2.yaml
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    with:
      actions_ref: ${{ inputs.actions_ref }}
      runner: ${{ inputs.runner }}
      pr_number: ${{ inputs.pr_number }}
      comment_body: ${{ inputs.comment_body }}
      comment_author: ${{ inputs.comment_author }}
      comment_id: ${{ inputs.comment_id }}
      ai_review_override_approvers: ${{ inputs.ai_review_override_approvers }}
      dispatch_command: ${{ inputs.dispatch_command }}
      dispatch_issue_state: ${{ inputs.dispatch_issue_state }}
      dispatch_event_action: ${{ inputs.dispatch_event_action }}
      dispatch_previous_body: ${{ inputs.dispatch_previous_body }}
      codex_version: ${{ inputs.codex_version }}
      codex_model: ${{ inputs.codex_model }}
      codex_reasoning_effort: ${{ inputs.codex_reasoning_effort }}
    secrets:
      FINN_DEVOPS_PERSONAL_ACCESS_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_AUTH_ALERT_WEBHOOK_URL: ${{ secrets.CODEX_AUTH_ALERT_WEBHOOK_URL }}
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
      AI_REVIEW_TELEMETRY_SUPABASE_URL: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL }}
      AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  # The Claude versions, 3, 4, and 5, share this job: the wrapper passes the version on to the pipeline.
  v3:
    if: >-
      (vars.AI_REVIEW_VERSION == '3' || vars.AI_REVIEW_VERSION == '4' || vars.AI_REVIEW_VERSION == '5') &&
      github.event_name != 'issue_comment' &&
      github.event_name != 'pull_request_review_comment'
    uses: ./.github/workflows/shareable-code-review-v3.yaml
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    with:
      review_version: ${{ vars.AI_REVIEW_VERSION }}
      actions_ref: ${{ inputs.actions_ref }}
      runner: ${{ inputs.runner }}
      pr_number: ${{ inputs.pr_number }}
      comment_body: ${{ inputs.comment_body }}
      comment_author: ${{ inputs.comment_author }}
      comment_id: ${{ inputs.comment_id }}
      ai_review_override_approvers: ${{ inputs.ai_review_override_approvers }}
      dispatch_command: ${{ inputs.dispatch_command }}
      dispatch_issue_state: ${{ inputs.dispatch_issue_state }}
      dispatch_event_action: ${{ inputs.dispatch_event_action }}
      dispatch_previous_body: ${{ inputs.dispatch_previous_body }}
      codex_version: ${{ inputs.codex_version }}
      codex_model: ${{ inputs.codex_model }}
      codex_reasoning_effort: ${{ inputs.codex_reasoning_effort }}
    secrets:
      FINN_DEVOPS_PERSONAL_ACCESS_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
      AI_REVIEW_TELEMETRY_SUPABASE_URL: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL }}
      AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY }}

  invalid-review-version:
    name: Invalid AI review version
    if: vars.AI_REVIEW_VERSION != '' && vars.AI_REVIEW_VERSION != '1' && vars.AI_REVIEW_VERSION != '2' && vars.AI_REVIEW_VERSION != '3' && vars.AI_REVIEW_VERSION != '4' && vars.AI_REVIEW_VERSION != '5'
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      - name: Reject unsupported review version
        run: |
          echo "::error::Unsupported AI_REVIEW_VERSION. Set the repository Actions variable to 1, 2, 3, 4, or 5, or remove it for V1."
          exit 1
# yamllint enable rule:line-length
