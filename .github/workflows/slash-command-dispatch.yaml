---
name: Slash Command Dispatch
on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  issues: read          # To read issue comments
  pull-requests: read   # To check if comment is on a PR

jobs:
  slashCommandDispatch:
    if: github.event.action == 'created'
    runs-on: finn-runners
    steps:
      - name: Slash Command Dispatch
        uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a  # v5.0.2
        with:
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          commands: |
            ai-review-breaker-reset
            ai-review-override
            growthbook-override
            no-experiment
            pr-size-override
            rebase
            review
          permission: write
          issue-type: pull-request

  overrideLifecycleDispatch:
    if: github.event.action != 'created'
    runs-on: finn-runners
    steps:
      # Fork PRs use base-owned helpers; same-repository branches can validate helper changes.
      - name: Checkout repository CI helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: ${{ github.repository }}
          ref: >-
            ${{
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.head.sha ||
              github.event.pull_request.base.sha || github.sha
            }}
          path: ci-source
          sparse-checkout: .github/finn-ci
          persist-credentials: false

      - name: Dispatch override lifecycle event
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
        run: python3 ci-source/.github/finn-ci/scripts/override_command_dispatch.py
