# This file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
#
# Public fork copy of repository-slash-command-dispatch.yaml. Jobs use GitHub-hosted
# runners, and edited or deleted command comments are routed only when their author
# has write access: any GitHub user can comment on a public repository.
---
name: Slash Command Dispatch
on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  issues: read          # To read issue comments
  pull-requests: read   # To check if comment is on a PR

jobs:
  slashCommandDispatch:
    # Start a runner only for new pull request comments that can hold a command.
    # The action trims the first line, so a leading space or tab must still pass.
    if: >-
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, '/') ||
        startsWith(github.event.comment.body, ' ') ||
        startsWith(github.event.comment.body, fromJSON('"\t"'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Slash Command Dispatch
        uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a  # v5.0.2
        with:
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          commands: |
            ai-review-breaker-reset
            ai-review-override
            full-review
            growthbook-override
            no-experiment
            pr-size-override
            rebase
            review
          permission: write
          issue-type: pull-request

  overrideLifecycleDispatch:
    if: >-
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, '/') ||
        startsWith(github.event.changes.body.from, '/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check comment author access
        id: access
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/collaborators/${COMMENT_AUTHOR}/permission"
          permission="$(gh api "$endpoint" --jq .permission)"
          case "$permission" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::override-dispatch: ${COMMENT_AUTHOR} lacks write permission" \
                "for ${GITHUB_REPOSITORY}; returned permission='${permission}'"
              ;;
          esac

      - name: Checkout EWA-Actions command router
        if: steps.access.outputs.allowed == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: main
          path: ewa-actions
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Dispatch override lifecycle event
        if: steps.access.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
        run: python3 ewa-actions/scripts/override_command_dispatch.py
