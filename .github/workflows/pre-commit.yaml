---
name: Pre-commit Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  pre-commit-check:
    runs-on: finn-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Restore cached
        id: cache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        env:
          CACHE_KEY_PREFIX: ${{ runner.os }}-${{ github.repository }}-${{ github.workflow }}
        with:
          path: |
            ${{ env.HOME }}/.cache/pre-commit/
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-

      - name: Install Kingfisher
        uses: EWA-Services/EWA-Actions/.github/actions/install-kingfisher@b0162aa9396641b046702bb90bdb1631f0a564f4

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        id: pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Diffing from $BASE_SHA to $HEAD_SHA"
          pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure

      - name: Generate diff patch
        if: failure()
        run: git diff --binary --no-color > pre-commit.patch

      - name: Upload diff patch
        if: always() && steps.pre-commit.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pre-commit-diff-${{ github.run_id }}
          path: pre-commit.patch
          retention-days: 1

      - name: Save cached
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        id: cache-save
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        env:
          CACHE_KEY_PREFIX: ${{ runner.os }}-${{ github.repository }}-${{ github.workflow }}
        with:
          path: |
            ${{ env.HOME }}/.cache/pre-commit/
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('.pre-commit-config.yaml') }}
