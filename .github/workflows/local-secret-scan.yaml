# Reusable secret scanning workflow.
---
name: Secret Scan

on:
  workflow_call:
    secrets:
      GOOGLE_CHAT_SECURITY_SCAN_SECRET_WEBHOOK:
        required: false

permissions: {}

env:
  KINGFISHER_VERSION: v1.108.0
  KF_RULE_CACHE_DIR: .kingfisher-cache

jobs:
  secret-scan:
    name: Scan changed files for secrets
    runs-on: finn-runners
    env:
      BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
    concurrency:
      group: secret-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Fork PRs use base-owned helpers; same-repository branches can validate helper changes.
      - name: Checkout repository CI helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: ${{ github.repository }}
          ref: >-
            ${{
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.head.sha ||
              github.event.pull_request.base.sha || github.sha
            }}
          path: ci-source
          sparse-checkout: .github/finn-ci
          persist-credentials: false

      - name: Fetch base branch
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          git branch --force "$CI_BRANCH" "$CI_HEAD_SHA"

      # Shared installer from merged PR #604, pinned to its immutable merge commit.
      - name: Install secret scanner
        uses: ./ci-source/.github/finn-ci/.github/actions/install-kingfisher

      - name: Prepare secret scanner rule cache
        run: |
          rm -rf -- "$KF_RULE_CACHE_DIR"
          mkdir -p "$KF_RULE_CACHE_DIR"

      - name: Restore secret scanner rule cache
        id: secret-scanner-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .kingfisher-cache
          key: ${{ runner.os }}-${{ github.repository }}-kingfisher-${{ env.KINGFISHER_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-kingfisher-

      - name: Pre-warm secret scanner rule cache
        run: kingfisher rules compile-cache

      - name: Load trusted secret scanner baseline
        id: secret-scanner-baseline
        env:
          BASELINE_PATH: kingfisher-baseline.yaml
        run: |
          baseline_ref="refs/remotes/origin/$BASE_BRANCH"
          if git cat-file -e "$baseline_ref:$BASELINE_PATH" 2>/dev/null; then
            baseline_file="$RUNNER_TEMP/kingfisher-baseline.yaml"
            git show "$baseline_ref:$BASELINE_PATH" > "$baseline_file"
            echo "path=$baseline_file" >> "$GITHUB_OUTPUT"
            echo "Using secret scanner baseline from $baseline_ref"
          else
            echo "No secret scanner baseline found on $baseline_ref"
          fi

      - name: Scan pull request changes
        id: secret-scan
        continue-on-error: true
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASELINE_FILE: ${{ steps.secret-scanner-baseline.outputs.path }}
        run: |
          report_path="$RUNNER_TEMP/kingfisher-report.json"
          base_ref="refs/remotes/origin/$BASE_BRANCH"
          scan_args=(
            scan .
            --redact
            --no-ignore
            --since-commit "$base_ref"
            --branch "$CI_BRANCH"
            --no-update-check
            --format json
            --output "$report_path"
          )
          if [[ -n "$BASELINE_FILE" ]]; then
            echo "Using secret scanner baseline: $BASELINE_FILE"
            scan_args+=(--baseline-file "$BASELINE_FILE")
          else
            echo "No secret scanner baseline found; scanning without a baseline"
          fi
          kingfisher "${scan_args[@]}"

      - name: Upload secret scan report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/kingfisher-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Post secret scan alerts
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: ./ci-source/.github/finn-ci/.github/actions/post-secret-scan-alert
        with:
          report-path: ${{ runner.temp }}/kingfisher-report.json
          github-token: ${{ github.token }}
          google-chat-webhook: ${{ secrets.GOOGLE_CHAT_SECURITY_SCAN_SECRET_WEBHOOK }}
          scan-outcome: ${{ steps.secret-scan.outcome }}

      - name: Enforce secret scan result
        if: ${{ always() && !cancelled() }}
        env:
          SCAN_OUTCOME: ${{ steps.secret-scan.outcome }}
        run: |
          if [[ "$SCAN_OUTCOME" != "success" ]]; then
            echo "Secret scan outcome: $SCAN_OUTCOME"
            exit 1
          fi

      - name: Save secret scanner rule cache
        if: ${{ always() && !cancelled() && steps.secret-scanner-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .kingfisher-cache
          key: ${{ runner.os }}-${{ github.repository }}-kingfisher-${{ env.KINGFISHER_VERSION }}
