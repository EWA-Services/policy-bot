# Public fork repositories receive byte-for-byte copies of this file through
# sync/bundles/workflow-public-fork-code-review.yml. Edit the source in
# EWA-Services/EWA-Actions; edits made in a fork copy are overwritten.
# Reusable Direct CLI Code Review Workflow
#
# yamllint disable rule:line-length
---
name: Code Review Pipeline

on:
  workflow_call:
    inputs:
      review_version:
        description: Internal review implementation version (1, 2, 3, 4, or 5)
        required: true
        type: string
      review_engine:
        description: CLI that runs the reviewers and the judge (codex or claude)
        required: false
        default: codex
        type: string
      actions_ref:
        description: EWA-Actions ref to check out for CI helper scripts
        required: false
        default: main
        type: string
      runner:
        description: Runner label for review jobs; public repositories need a GitHub-hosted runner
        required: false
        default: finn-runners
        type: string
      pr_number:
        description: Pull request number to review
        required: false
        default: ""
        type: string
      comment_body:
        description: Exact slash command forwarded by repository dispatch
        required: false
        default: ""
        type: string
      comment_author:
        description: Actor forwarded by repository dispatch
        required: false
        default: manual-dispatch
        type: string
      comment_id:
        description: Slash-command comment identifier
        required: false
        default: ""
        type: string
      ai_review_override_approvers:
        description: GitHub logins allowed to override AI review
        required: false
        default: jai
        type: string
      dispatch_command:
        description: Command name forwarded by Slash Command Dispatch
        required: false
        default: ""
        type: string
      dispatch_issue_state:
        description: Pull-request state forwarded by Slash Command Dispatch
        required: false
        default: ""
        type: string
      dispatch_event_action:
        description: Comment action forwarded by Slash Command Dispatch
        required: false
        default: ""
        type: string
      dispatch_previous_body:
        description: Previous comment body forwarded for edit events
        required: false
        default: ""
        type: string
      codex_version:
        description: Codex CLI version to install for direct CLI runs (latest or exact semver)
        required: false
        default: latest
        type: string
      codex_model:
        description: Codex model to use for direct CLI runs
        required: false
        default: gpt-6-astra
        type: string
      codex_reasoning_effort:
        description: Codex reasoning effort for direct CLI runs (none|low|medium|high|xhigh)
        required: false
        default: high
        type: string
    secrets:
      FINN_DEVOPS_PERSONAL_ACCESS_TOKEN:
        required: true
      LINEAR_API_KEY:
        required: false
      TYPESAFE_API_KEY:
        required: false
      CODEX_AUTH_JSON:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_2:
        required: false
      CODEX_AUTH_ALERT_WEBHOOK_URL:
        required: false
      FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY:
        required: false
      AI_REVIEW_TELEMETRY_SUPABASE_URL:
        required: false
      AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY:
        required: false

permissions: {}

env:
  EXPECTED_REVIEW_GH_LOGIN: finn-devops
  # Public repositories publish their Actions logs and artifacts, and anyone can open pull requests and comment
  # there. The scripts read this to review only the repository's own branches, to read no Linear ticket, and to
  # give the judge only comments from people with access. Only "true" counts as private.
  REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
  AI_REVIEW_VERSION: ${{ inputs.review_version }}
  AI_REVIEW_BREAKER_ENABLED: ${{ vars.AI_REVIEW_BREAKER_ENABLED != 'false' }}

jobs:
  welcome:
    name: Welcome message
    runs-on: ${{ inputs.runner }}
    if: >-
      inputs.review_engine != 'claude' && github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Check for existing welcome message
        id: check-welcome
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          existing_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '[.[] | select(.body | contains("**Code Review Assistant**"))] | length')"
          if [ "${existing_count}" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post welcome message
        if: steps.check-welcome.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$(cat <<'EOF'
          🤖 **Code Review Assistant**

          AI-powered reviews use **GPT-6 Astra** with `high` reasoning and the canonical `finn-pr-review` skill.

          **How to trigger a review:**
          - Comment `/review` for a full PR inspection, with optional context after the command
          - Mention `@finn-codex` in a PR comment or inline thread to ask a question
          - An authorized approver can comment exactly `/ai-review-override` to accept the current PR head without another AI inspection
          - Comment exactly `/ai-review-breaker-reset` to resume a paused AI review:
            - Art or Bhargav can reset after 5 or fewer decisive AI reviews
            - Poom can reset after 10 or fewer decisive AI reviews
            - Jai can reset at any review count

          **Review behavior:**
          - `finn-pr-review` owns the review method and decision policy
          - Accepted findings appear on the changed lines, with fix prompts and code suggestions where possible
          - Comment replies leave the full-review verdict and check unchanged
          - A **WAIT** decision publishes an informational review and keeps the review check non-green

          _Note: Full reviews run automatically when a draft PR is marked ready for review._
          EOF
          )"

  resolve-context:
    name: Resolve review context
    runs-on: ${{ inputs.runner }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review')
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      check_required: ${{ steps.resolve.outputs.check_required }}
      run_codex: ${{ steps.resolve.outputs.run_codex }}
      target_pr_number: ${{ steps.resolve.outputs.target_pr_number }}
      comment_author: ${{ steps.resolve.outputs.comment_author }}
      comment_id: ${{ steps.resolve.outputs.comment_id }}
      reply_required: ${{ steps.resolve.outputs.reply_required }}
      reply_kind: ${{ steps.resolve.outputs.reply_kind }}
      reply_head_sha: ${{ steps.resolve.outputs.reply_head_sha }}
      review_context_base64: ${{ steps.resolve.outputs.review_context_base64 }}
      force_full_review: ${{ steps.resolve.outputs.force_full_review }}
      full_review_requested: ${{ steps.resolve.outputs.full_review_requested }}
      reuse_notice_required: ${{ steps.resolve.outputs.reuse_notice_required }}
      breaker_reset_actor: ${{ steps.resolve.outputs.breaker_reset_actor }}
      breaker_reset_comment_id: ${{ steps.resolve.outputs.breaker_reset_comment_id }}
      review_override_actor: ${{ steps.resolve.outputs.review_override_actor }}
      codex_version: ${{ steps.resolve.outputs.codex_version }}
      codex_model: ${{ steps.resolve.outputs.codex_model }}
      codex_reasoning_effort: ${{ steps.resolve.outputs.codex_reasoning_effort }}
      review_version: ${{ steps.resolve.outputs.review_version }}

    steps:
      - name: Validate review GitHub token identity
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          actual_login="$(gh api user --jq .login)"
          if [ "${actual_login}" != "${EXPECTED_REVIEW_GH_LOGIN}" ]; then
            echo "::error::FINN_DEVOPS_PERSONAL_ACCESS_TOKEN resolves to '${actual_login}', expected '${EXPECTED_REVIEW_GH_LOGIN}'." >&2
            exit 1
          fi

      - name: Checkout EWA-Actions helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: ${{ inputs.actions_ref }}
          path: ewa-actions
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Resolve trigger and comment context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_COMMENT_BODY: ${{ inputs.comment_body }}
          DISPATCH_COMMENT_AUTHOR: ${{ inputs.comment_author }}
          DISPATCH_COMMENT_ID: ${{ inputs.comment_id }}
          AI_REVIEW_OVERRIDE_APPROVERS: ${{ inputs.ai_review_override_approvers }}
          DISPATCH_COMMAND: ${{ inputs.dispatch_command }}
          DISPATCH_ISSUE_STATE: ${{ inputs.dispatch_issue_state }}
          DISPATCH_EVENT_ACTION: ${{ inputs.dispatch_event_action }}
          DISPATCH_PREVIOUS_BODY: ${{ inputs.dispatch_previous_body }}
          CODEX_VERSION_INPUT: ${{ inputs.codex_version }}
          CODEX_MODEL_INPUT: ${{ inputs.codex_model }}
          CODEX_REASONING_EFFORT_INPUT: ${{ inputs.codex_reasoning_effort }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          REVIEW_ENGINE: ${{ inputs.review_engine }}
          AI_REVIEW_REASONING_EFFORT: ${{ vars.AI_REVIEW_REASONING_EFFORT }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/code_review/code_review_workflow.py resolve-context

      - name: Validate resolved review inputs
        if: steps.resolve.outputs.should_run == 'true'
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.target_pr_number }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/code_review/code_review_breaker_publish.py validate-inputs \
            --pr-number "$PR_NUMBER"

  ai-review-check-start:
    name: Prepare finn-ai-coder review target
    needs: resolve-context
    if: >-
      ${{
        needs.resolve-context.outputs.should_run == 'true' &&
        needs.resolve-context.outputs.check_required == 'true'
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.gate.outputs.action || steps.breaker-reset.outputs.action }}
      progress_comment_id: ${{ steps.review-progress.outputs.comment_id }}
      progress_state: ${{ steps.review-progress.outputs.progress_state }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      diff_signature: ${{ steps.target.outputs.diff_signature }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      head_ref: ${{ steps.target.outputs.head_ref }}
      first_review: ${{ steps.gate.outputs.first_review }}
    env:
      TARGET_PR_NUMBER: ${{ needs.resolve-context.outputs.target_pr_number }}
    steps:
      - name: Create EWA-Actions checkout token
        id: ewa-actions-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          owner: EWA-Services
          repositories: EWA-Actions
          permission-contents: read

      - name: Checkout EWA-Actions helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: ${{ inputs.actions_ref }}
          path: ewa-actions
          token: ${{ steps.ewa-actions-token.outputs.token }}
          persist-credentials: false

      - name: Resolve AI review target
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/finn_ai_coder_github_app.py resolve-target \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER"

      - name: Apply approved AI review breaker reset
        id: breaker-reset
        if: needs.resolve-context.outputs.breaker_reset_actor != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head_sha }}
          RESET_ACTOR: ${{ needs.resolve-context.outputs.breaker_reset_actor }}
          RESET_COMMENT_ID: ${{ needs.resolve-context.outputs.breaker_reset_comment_id }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/code_review/code_review_breaker_publish.py reset \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER" \
            --expected-head "$EXPECTED_HEAD" \
            --actor "$RESET_ACTOR" \
            --comment-id "$RESET_COMMENT_ID"

      - name: Create finn-ai-coder GitHub App token
        id: finn-ai-coder-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: read

      - name: Evaluate pre-review gate
        id: gate
        if: >-
          ${{
            needs.resolve-context.outputs.breaker_reset_actor == '' ||
            steps.breaker-reset.outputs.action == 'applied'
          }}
        env:
          GH_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head_sha }}
          DIFF_SIGNATURE: ${{ steps.target.outputs.diff_signature }}
          CODEX_MODEL: ${{ needs.resolve-context.outputs.review_override_actor == '' && needs.resolve-context.outputs.codex_model || '' }}
          FORCE_FULL_REVIEW: ${{ needs.resolve-context.outputs.force_full_review }}
          REVIEW_OVERRIDE_ACTOR: ${{ needs.resolve-context.outputs.review_override_actor }}
          REUSE_NOTICE: ${{ needs.resolve-context.outputs.reuse_notice_required }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/code_review_gate.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER" \
            --expected-head "$EXPECTED_HEAD" \
            --diff-signature "$DIFF_SIGNATURE" \
            --force-full-review "$FORCE_FULL_REVIEW" \
            --review-override-actor "$REVIEW_OVERRIDE_ACTOR" \
            --reuse-notice "$REUSE_NOTICE" \
            --breaker-enabled "$AI_REVIEW_BREAKER_ENABLED" \
            --skip-live-diff-check \
            --model "$CODEX_MODEL" \
            --external-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:review"

      - name: Post AI review progress acknowledgement
        id: review-progress
        if: steps.gate.outputs.action == 'run' && needs.resolve-context.outputs.run_codex == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_VERSION: ${{ needs.resolve-context.outputs.review_version }}
        run: python3 ewa-actions/scripts/code_review/code_review_progress.py

  codex-direct-cli:
    name: ${{ format('{0} V{1} code review', inputs.review_engine == 'claude' && 'Claude' || 'Codex', inputs.review_version) }}
    needs:
      - resolve-context
      - ai-review-check-start
    if: >-
      ${{
        always() &&
        needs.resolve-context.outputs.should_run == 'true' &&
        needs.resolve-context.outputs.run_codex == 'true' &&
        (
          needs.resolve-context.outputs.check_required != 'true' ||
          (
            needs.ai-review-check-start.result == 'success' &&
            needs.ai-review-check-start.outputs.action == 'run'
          )
        )
      }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.review_engine == 'claude' && 40 || 30 }}
    concurrency:
      group: code-review-${{ github.repository }}-${{ needs.resolve-context.outputs.check_required == 'true' && needs.resolve-context.outputs.target_pr_number || github.run_id }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.codex-parse.outputs.verdict }}
      verdict_reason_base64: ${{ steps.codex-parse.outputs.verdict_reason_base64 }}
      findings_base64: ${{ steps.codex-parse.outputs.findings_base64 }}
      skill_catalog_sha: ${{ steps.skill-catalog.outputs.sha }}
      full_review_performed: ${{ steps.codex-parse.outputs.full_review_performed }}
      review_invocation_id: ${{ steps.review-invocation.outputs.id }}
      primary_evidence_id: ${{ steps.primary-evidence.outputs.artifact-id }}
      telemetry: ${{ steps.telemetry.outputs.telemetry }}
      progress_state: ${{ steps.codex-run.outputs.progress_state || needs.ai-review-check-start.outputs.progress_state }}
      review_mode: ${{ steps.v5-prepare.outputs.review_mode }}
      # Versions 2 to 4: "stopped" when the PR got a new commit during the review; the review then has no result
      # to publish. A version 5 review runs to the end, and its result is published for the reviewed commit.
      review_status: ${{ steps.codex-run.outputs.status }}
      open_must_fix_count: ${{ steps.v5-prepare.outputs.open_must_fix_count }}
      # The newest decisive review when this review started (0: none). The publisher publishes a version 5 result
      # for a commit that is no longer the head only when no decisive review (approved or changes requested) was
      # published since.
      baseline_review_id: ${{ steps.v5-prepare.outputs.baseline_review_id }}
      # Later jobs trust the version 5 files only by these hashes: the reviewers run with a shell on this runner.
      increment_sha256: ${{ steps.v5-prepare.outputs.increment_sha256 }}
      open_findings_sha256: ${{ steps.v5-prepare.outputs.open_findings_sha256 }}
    env:
      TARGET_PR_NUMBER: ${{ needs.resolve-context.outputs.target_pr_number }}
      CODEX_VERSION: ${{ needs.resolve-context.outputs.codex_version }}
      CODEX_MODEL: ${{ needs.resolve-context.outputs.codex_model }}
      CODEX_REASONING_EFFORT: ${{ needs.resolve-context.outputs.codex_reasoning_effort }}
      CHECK_REQUIRED: ${{ needs.resolve-context.outputs.check_required }}
      REVIEW_HEAD_SHA: ${{ needs.ai-review-check-start.outputs.head_sha || needs.resolve-context.outputs.reply_head_sha }}
      REVIEW_CONTEXT_BASE64: ${{ needs.resolve-context.outputs.review_context_base64 }}
      COMMENT_ID: ${{ needs.resolve-context.outputs.comment_id }}
      COMMENT_AUTHOR: ${{ needs.resolve-context.outputs.comment_author }}
      REPLY_KIND: ${{ needs.resolve-context.outputs.reply_kind }}
      REVIEW_DIFF_SIGNATURE: ${{ needs.ai-review-check-start.outputs.diff_signature }}
      CODEX_COMMENT_LOGIN: finn-ai-coder[bot]
      AI_REVIEW_VERSION: ${{ needs.resolve-context.outputs.review_version }}
      REVIEW_BASE_SHA: ${{ needs.ai-review-check-start.outputs.base_sha }}
      # Version 4 reads these: the first review of a pull request runs each reviewer role twice.
      REVIEW_FIRST_REVIEW: ${{ needs.ai-review-check-start.outputs.first_review }}
      AI_REVIEW_PARALLEL_REVIEWERS: ${{ vars.AI_REVIEW_PARALLEL_REVIEWERS }}

    steps:
      - name: Identify AI review invocation
        id: review-invocation
        run: printf 'id=%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.REVIEW_HEAD_SHA }}
          fetch-depth: 0
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Prepare Codex home
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: mkdir -p "$CODEX_HOME"

      - name: Checkout EWA-Actions helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: ${{ inputs.actions_ref }}
          path: .ewa-actions-helper
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Stage code-review workflow helper
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scripts/code_review"
          cp .ewa-actions-helper/scripts/code_review/*.py "${RUNNER_TEMP}/scripts/code_review/"
          cp -R .ewa-actions-helper/scripts/code_review/prompts "${RUNNER_TEMP}/scripts/code_review/"
          cp -R .ewa-actions-helper/scripts/code_review/schemas "${RUNNER_TEMP}/scripts/code_review/"
          cp -R .ewa-actions-helper/scripts/code_review/gh_shim "${RUNNER_TEMP}/scripts/code_review/"
          chmod +x "${RUNNER_TEMP}/scripts/code_review/gh_shim/gh"
          cp .ewa-actions-helper/scripts/code_review_alerts.py "${RUNNER_TEMP}/scripts/"
          cp .ewa-actions-helper/scripts/code_review_common.py "${RUNNER_TEMP}/scripts/"
          cp .ewa-actions-helper/scripts/finn_ai_coder_github_app.py "${RUNNER_TEMP}/scripts/"
          cp .ewa-actions-helper/scripts/code_review_history.py "${RUNNER_TEMP}/scripts/"
          cp .ewa-actions-helper/scripts/override_commands.py "${RUNNER_TEMP}/scripts/"

      - name: Create Codex GitHub interaction token
        id: codex-github-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read  # dates Digger plan comments against the head commit
          permission-issues: read
          permission-pull-requests: read

      - name: Validate AI review skill catalog token
        env:
          AI_REVIEW_SKILL_CATALOG_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_skills.py" validate-catalog-token

      - name: Checkout AI review skill catalog
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/agent-resources
          ref: main
          path: .agent-resources
          sparse-checkout: |
            /skills/finn-pr-review/
            /skills/finn-coding-standards/
          sparse-checkout-cone-mode: false
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Record AI review skill catalog revision
        id: skill-catalog
        run: echo "sha=$(git -C .agent-resources rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install AI review skill
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_skills.py" install

      - name: Setup Ruby for the AI review skill
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1.324.0
        with:
          ruby-version: "3.3"

      - name: Setup Go for the AI review skill
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 1.26.x

      - name: Validate Codex auth input
        if: inputs.review_engine != 'claude'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "Need CODEX_AUTH_JSON to run the direct Codex CLI review workflow." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"

      - name: Install Codex CLI
        if: inputs.review_engine != 'claude'
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_tooling.py" install-codex

      - name: Select Claude OAuth token
        id: claude-token
        if: inputs.review_engine == 'claude'
        # A failed selection leaves the slot empty, so the job uses CLAUDE_CODE_OAUTH_TOKEN as before.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_claude_token.py"

      - name: Validate Claude OAuth input
        if: inputs.review_engine == 'claude'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (steps.claude-token.outputs.slot == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
        run: test -n "$CLAUDE_CODE_OAUTH_TOKEN"

      - name: Install Claude CLI
        if: inputs.review_engine == 'claude'
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" -g --ignore-scripts=false @anthropic-ai/claude-code@2.1.280
          echo "$RUNNER_TEMP/claude-cli/bin" >> "$GITHUB_PATH"

      - name: Configure Codex authentication
        id: codex-auth
        if: inputs.review_engine != 'claude'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          HOME: ${{ runner.temp }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_codex.py" authenticate

      - name: Collect open PR stack
        if: needs.resolve-context.outputs.reply_required != 'true'
        env:
          GH_TOKEN: ${{ steps.codex-github-token.outputs.token }}
          REVIEW_STACK_CONTEXT_PATH: ${{ runner.temp }}/review-v2-artifacts/stack-context.json
          # Only the Claude reviews have the comment filter, so only they collect PR comments.
          REVIEW_PR_COMMENTS_PATH: ${{ inputs.review_engine == 'claude' && format('{0}/review-v2-artifacts/pr-comments.json', runner.temp) || '' }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_stack_context.py"

      - name: Collect Linear ticket description
        id: ticket-description
        if: needs.resolve-context.outputs.reply_required != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.codex-github-token.outputs.token }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_ticket_context.py"

      - name: Filter PR comments for the judge
        if: needs.resolve-context.outputs.reply_required != 'true' && inputs.review_engine == 'claude'
        # The judge reads comments only from a file the filter marked ok; a failed step removes the file.
        continue-on-error: true
        env:
          HOME: ${{ runner.temp }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (steps.claude-token.outputs.slot == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          REVIEW_PR_COMMENTS_PATH: ${{ runner.temp }}/review-v2-artifacts/pr-comments.json
          REVIEW_STACK_CONTEXT_PATH: ${{ runner.temp }}/review-v2-artifacts/stack-context.json
          REVIEW_TICKET_DESCRIPTION_PATH: ${{ runner.temp }}/review-v2-artifacts/ticket-description.txt
          REVIEW_TICKET_TITLE_PATH: ${{ runner.temp }}/review-v2-artifacts/ticket-title.txt
        run: |
          set -euo pipefail
          # A failed filter must leave no comment file: reviewers and the judge can read files on the runner.
          trap 'rm -f "$REVIEW_PR_COMMENTS_PATH" "${REVIEW_PR_COMMENTS_PATH}.filtered"; echo "::warning::PR comment filter failed; the judge gets no PR comments."' ERR
          python3 "${RUNNER_TEMP}/scripts/code_review/code_review_comment_filter.py" > "${REVIEW_PR_COMMENTS_PATH}.filtered"
          # An empty result means nothing was filtered: fail the step, so the trap removes both files.
          test -s "${REVIEW_PR_COMMENTS_PATH}.filtered"
          mv "${REVIEW_PR_COMMENTS_PATH}.filtered" "$REVIEW_PR_COMMENTS_PATH"

      # Version 5: choose a full or an incremental review, and collect the earlier must-fix findings still open.
      - name: Prepare version 5 review
        id: v5-prepare
        if: needs.resolve-context.outputs.reply_required != 'true' && env.AI_REVIEW_VERSION == '5'
        env:
          CODEX_GITHUB_TOKEN: ${{ steps.codex-github-token.outputs.token }}
          REVIEW_FULL_REVIEW_REQUESTED: ${{ needs.resolve-context.outputs.full_review_requested }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_open_findings.py"

      - name: Show API budget before the review CLI
        if: always() && needs.resolve-context.outputs.reply_required != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.codex-github-token.outputs.token }}
        run: bash .ewa-actions-helper/scripts/show_api_budget.sh before-review

      - name: Run review CLI directly
        id: codex-run
        if: needs.resolve-context.outputs.reply_required != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROGRESS_COMMENT_ID: ${{ needs.ai-review-check-start.outputs.progress_comment_id }}
          PROGRESS_STATE: ${{ needs.ai-review-check-start.outputs.progress_state }}
          REVIEW_TICKET_DESCRIPTION_PATH: ${{ runner.temp }}/review-v2-artifacts/ticket-description.txt
          REVIEW_STACK_CONTEXT_PATH: ${{ runner.temp }}/review-v2-artifacts/stack-context.json
          CODEX_HOME: ${{ runner.temp }}/codex-home
          HOME: ${{ runner.temp }}
          CODEX_GITHUB_TOKEN: ${{ steps.codex-github-token.outputs.token }}
          REVIEW_GH_TOKEN: ""
          CODEX_TIMEOUT_SECONDS: ${{ inputs.review_engine == 'claude' && '1800' || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.review_engine == 'claude' && (steps.claude-token.outputs.slot == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN) || '' }}
          # Version 5 reads the mode and the changed lines that the prepare step saved.
          REVIEW_INCREMENT_PATH: ${{ runner.temp }}/review-v2-artifacts/increment.json
          REVIEW_INCREMENT_SHA256: ${{ steps.v5-prepare.outputs.increment_sha256 }}
        # Codex receives read-only GitHub credentials; the trusted wrapper publishes the result.
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_codex.py" run

      - name: Show API budget after the review CLI
        if: always() && needs.resolve-context.outputs.reply_required != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.codex-github-token.outputs.token }}
        run: bash .ewa-actions-helper/scripts/show_api_budget.sh after-review

      - name: Summarize reviewer GitHub CLI calls
        if: always() && steps.codex-run.outcome != 'skipped'
        continue-on-error: true
        run: |
          log="${RUNNER_TEMP}/review-gh-calls/calls.log"
          if [ -f "$log" ]; then
            python3 "${RUNNER_TEMP}/scripts/code_review/gh_call_summary.py" < "$log"
          else
            echo "::notice::Reviewer gh calls: no log recorded (shim inactive)"
          fi

      - name: Save reviewer GitHub CLI call log
        if: always() && steps.codex-run.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ai-review-gh-calls-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-gh-calls/calls.log
          retention-days: 14
          if-no-files-found: warn

      - name: Answer review comment
        id: reply-run
        if: needs.resolve-context.outputs.reply_required == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          HOME: ${{ runner.temp }}
          GH_TOKEN: ${{ steps.codex-github-token.outputs.token }}
          CODEX_GITHUB_TOKEN: ${{ steps.codex-github-token.outputs.token }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_replies.py" run

      - name: Create comment reply token
        id: reply-token
        if: needs.resolve-context.outputs.reply_required == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Publish comment reply
        if: needs.resolve-context.outputs.reply_required == 'true'
        env:
          GH_TOKEN: ${{ steps.reply-token.outputs.token }}
        run: python3 "${RUNNER_TEMP}/scripts/code_review/code_review_replies.py" publish

      - name: Alert on Codex auth invalidation
        if: inputs.review_engine != 'claude' && failure() && (steps.codex-auth.outputs.exit_code != '' || steps.codex-run.outputs.exit_code != '' || steps.reply-run.outputs.exit_code != '')
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          CODEX_AUTH_ALERT_WEBHOOK_URL: ${{ secrets.CODEX_AUTH_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/scripts/code_review/code_review_workflow.py" notify-codex-auth-failure \
            --error-log codex-error.txt \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --job-name "code-review / Codex direct CLI code review" \
            --model "$CODEX_MODEL" \
            --secret-name CODEX_AUTH_JSON

      - name: Parse Codex review result
        id: codex-parse
        if: needs.resolve-context.outputs.reply_required != 'true' && steps.codex-run.outputs.status != 'stopped'
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/scripts/code_review/code_review_workflow.py" parse-review-result

      - name: Prepare count-only review telemetry
        id: telemetry
        if: needs.resolve-context.outputs.reply_required != 'true' && steps.codex-run.outputs.status != 'stopped'
        continue-on-error: true
        run: python3 "${RUNNER_TEMP}/scripts/code_review/review_telemetry_workflow.py" review

      - name: Save review token usage
        if: always() && steps.codex-run.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ai-review-usage-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-usage/primary-*.json
            ${{ runner.temp }}/review-usage/comment-filter.json
          retention-days: 14
          if-no-files-found: warn

      - name: Stage primary review evidence
        if: always() && steps.ticket-description.outcome == 'success'
        run: |
          for file in codex-review.json codex-review-filtered.json; do
            if [ -f "$GITHUB_WORKSPACE/$file" ]; then
              cp "$GITHUB_WORKSPACE/$file" "$RUNNER_TEMP/review-v2-artifacts/$file"
            fi
          done
          # Anyone can download a public repository's artifacts. The reviewer schema carries prompt text, and no later job reads it.
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            rm -f "$RUNNER_TEMP/review-v2-artifacts/primary-schema.json"
          fi

      - name: Save primary review evidence
        id: primary-evidence
        if: always() && steps.ticket-description.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ai-review-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-v2-artifacts/*.json
            ${{ runner.temp }}/review-v2-artifacts/ticket-description.txt
          retention-days: 14
          if-no-files-found: warn

  shadow-admission:
    name: Filter blocking AI review findings
    needs:
      - resolve-context
      - ai-review-check-start
      - codex-direct-cli
    # A version 5 judge also runs on an approving review to check the earlier must-fix findings still open.
    if: >-
      ${{
        always() &&
        needs.codex-direct-cli.result == 'success' &&
        (
          needs.codex-direct-cli.outputs.verdict == 'REQUEST_CHANGES' ||
          (
            needs.codex-direct-cli.outputs.verdict == 'APPROVE' &&
            needs.codex-direct-cli.outputs.open_must_fix_count != '' &&
            needs.codex-direct-cli.outputs.open_must_fix_count != '0'
          )
        )
      }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ needs.resolve-context.outputs.review_version == '1' && 10 || 40 }}
    continue-on-error: true
    outputs:
      status: ${{ steps.admission.outputs.status }}
      classification: ${{ steps.admission.outputs.classification }}
      reason_base64: ${{ steps.admission.outputs.reason_base64 }}
      admitted_findings: ${{ steps.admission.outputs.admitted_findings }}
      judge_artifact_name: ${{ format('ai-review-judge-{0}-{1}', github.run_id, github.run_attempt) }}
      telemetry: ${{ steps.admission.outputs.telemetry }}
      progress_state: ${{ steps.judge-done-progress.outputs.progress_state || steps.judge-running-progress.outputs.progress_state || needs.codex-direct-cli.outputs.progress_state }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Checkout EWA-Actions helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: ${{ inputs.actions_ref }}
          path: .ewa-actions-shadow-helper
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Select Claude OAuth token
        id: claude-token
        if: inputs.review_engine == 'claude'
        # A failed selection leaves the slot empty, so the admission check uses CLAUDE_CODE_OAUTH_TOKEN as before.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: python3 .ewa-actions-shadow-helper/scripts/code_review/code_review_claude_token.py

      - name: Create read-only shadow GitHub token
        id: shadow-github-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Download primary review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.codex-direct-cli.outputs.primary_evidence_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/primary-review-artifacts

      - name: Show judge progress
        id: judge-running-progress
        if: needs.ai-review-check-start.outputs.progress_comment_id != '' && needs.resolve-context.outputs.review_version != '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR_NUMBER: ${{ needs.resolve-context.outputs.target_pr_number }}
          AI_REVIEW_VERSION: ${{ needs.resolve-context.outputs.review_version }}
          PROGRESS_COMMENT_ID: ${{ needs.ai-review-check-start.outputs.progress_comment_id }}
          PROGRESS_STATE: ${{ needs.codex-direct-cli.outputs.progress_state }}
          PROGRESS_UPDATES: "{\"judge\":\"running\"}"
        run: python3 .ewa-actions-shadow-helper/scripts/code_review/code_review_progress.py

      - name: Run admission check
        id: admission
        uses: ./.ewa-actions-shadow-helper/.github/actions/code-review-shadow-admission
        with:
          repository: ${{ github.repository }}
          pr-number: ${{ needs.resolve-context.outputs.target_pr_number }}
          base-sha: ${{ needs.ai-review-check-start.outputs.base_sha }}
          head-sha: ${{ needs.ai-review-check-start.outputs.head_sha }}
          diff-signature: ${{ needs.ai-review-check-start.outputs.diff_signature }}
          trusted-review-verdict: ${{ needs.codex-direct-cli.outputs.verdict }}
          trusted-review-reason-base64: ${{ needs.codex-direct-cli.outputs.verdict_reason_base64 }}
          trusted-review-findings-base64: ${{ needs.codex-direct-cli.outputs.findings_base64 }}
          review-context-base64: ${{ needs.resolve-context.outputs.review_context_base64 }}
          ticket-description-path: ${{ runner.temp }}/primary-review-artifacts/ticket-description.txt
          stack-context-path: ${{ runner.temp }}/primary-review-artifacts/stack-context.json
          pr-comments-path: ${{ runner.temp }}/primary-review-artifacts/pr-comments.json
          primary-review-path: ${{ runner.temp }}/primary-review-artifacts/codex-review.json
          open-findings-path: ${{ needs.resolve-context.outputs.review_version == '5' && format('{0}/primary-review-artifacts/open-must-fix.json', runner.temp) || '' }}
          increment-path: ${{ needs.resolve-context.outputs.review_version == '5' && format('{0}/primary-review-artifacts/increment.json', runner.temp) || '' }}
          open-findings-sha256: ${{ needs.codex-direct-cli.outputs.open_findings_sha256 }}
          increment-sha256: ${{ needs.codex-direct-cli.outputs.increment_sha256 }}
          skill-catalog-sha: ${{ needs.codex-direct-cli.outputs.skill_catalog_sha }}
          github-token: ${{ steps.shadow-github-token.outputs.token }}
          skill-catalog-token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          claude-code-oauth-token: ${{ (steps.claude-token.outputs.slot == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          codex-version: ${{ needs.resolve-context.outputs.codex_version }}
          review-version: ${{ needs.resolve-context.outputs.review_version }}
          review-engine: ${{ inputs.review_engine }}
          review-model: ${{ needs.resolve-context.outputs.codex_model }}
          review-reasoning-effort: ${{ needs.resolve-context.outputs.codex_reasoning_effort }}

      - name: Finish judge progress
        id: judge-done-progress
        if: always() && needs.ai-review-check-start.outputs.progress_comment_id != '' && needs.resolve-context.outputs.review_version != '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR_NUMBER: ${{ needs.resolve-context.outputs.target_pr_number }}
          AI_REVIEW_VERSION: ${{ needs.resolve-context.outputs.review_version }}
          PROGRESS_COMMENT_ID: ${{ needs.ai-review-check-start.outputs.progress_comment_id }}
          PROGRESS_STATE: ${{ steps.judge-running-progress.outputs.progress_state || needs.codex-direct-cli.outputs.progress_state }}
          # Versions 2 to 4: the judge reports "stopped" when the PR got a new commit before or while it ran.
          PROGRESS_UPDATES: ${{ format('{{"judge":"{0}"}}', steps.admission.outputs.status == 'success' && 'done' || steps.admission.outputs.status == 'stopped' && 'cancelled' || 'failed') }}
        run: python3 .ewa-actions-shadow-helper/scripts/code_review/code_review_progress.py

  ai-review-check-finish:
    name: Finish finn-ai-coder review check
    needs:
      - resolve-context
      - ai-review-check-start
      - codex-direct-cli
      - shadow-admission
    if: >-
      ${{
        always() &&
        needs.resolve-context.outputs.should_run == 'true' &&
        needs.resolve-context.outputs.check_required == 'true' &&
        needs.ai-review-check-start.outputs.action == 'run'
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: write
    env:
      TARGET_PR_NUMBER: ${{ needs.resolve-context.outputs.target_pr_number }}
      CHECK_REQUIRED: ${{ needs.resolve-context.outputs.check_required }}
      RUN_CODEX: ${{ needs.resolve-context.outputs.run_codex }}
      START_RESULT: ${{ needs.ai-review-check-start.result }}
      CODEX_RESULT: ${{ needs.codex-direct-cli.result }}
      CODEX_VERDICT: ${{ needs.codex-direct-cli.outputs.verdict }}
      CODEX_REASON_BASE64: ${{ needs.codex-direct-cli.outputs.verdict_reason_base64 }}
      CODEX_FINDINGS_BASE64: ${{ needs.codex-direct-cli.outputs.findings_base64 }}
      CODEX_FULL_REVIEW: ${{ needs.codex-direct-cli.outputs.full_review_performed }}
      CODEX_MODEL: ${{ needs.resolve-context.outputs.codex_model }}
      REVIEW_OVERRIDE_ACTOR: ${{ needs.resolve-context.outputs.review_override_actor }}
      ADMISSION_RESULT: ${{ needs.shadow-admission.outputs.status }}
      ADMISSION_CLASSIFICATION: ${{ needs.shadow-admission.outputs.classification }}
      ADMISSION_REASON_BASE64: ${{ needs.shadow-admission.outputs.reason_base64 }}
      ADMISSION_ADMITTED_FINDINGS: ${{ needs.shadow-admission.outputs.admitted_findings }}
      AI_REVIEW_VERSION: ${{ needs.resolve-context.outputs.review_version }}
      TELEMETRY_ENABLED: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL != '' && secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY != '' }}
      REVIEW_INVOCATION_ID: ${{ needs.codex-direct-cli.outputs.review_invocation_id }}
      REVIEW_DIFF_SIGNATURE: ${{ needs.ai-review-check-start.outputs.diff_signature }}
      REVIEW_HEAD_SHA: ${{ needs.ai-review-check-start.outputs.head_sha }}
      JEV_ENABLED: ${{ secrets.TYPESAFE_API_KEY != '' && needs.resolve-context.outputs.review_version != '1' }}
      INCREMENT_SHA256: ${{ needs.codex-direct-cli.outputs.increment_sha256 }}
      OPEN_FINDINGS_SHA256: ${{ needs.codex-direct-cli.outputs.open_findings_sha256 }}
      BASELINE_REVIEW_ID: ${{ needs.codex-direct-cli.outputs.baseline_review_id }}
      # Versions 2 to 4: the reviewer or the judge stopped because the PR got a new commit: publish nothing and do
      # not fail the run. In version 4, "Complete the check of a review without a result" cancels the reviewed
      # head's check. A version 5 review never stops for a new commit.
      REVIEW_STOPPED: >-
        ${{ needs.codex-direct-cli.outputs.review_status == 'stopped' || needs.shadow-admission.outputs.status == 'stopped' }}
    steps:
      - name: Create EWA-Actions checkout token
        id: ewa-actions-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          owner: EWA-Services
          repositories: EWA-Actions
          permission-contents: read

      - name: Checkout EWA-Actions helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: ${{ inputs.actions_ref }}
          path: ewa-actions
          token: ${{ steps.ewa-actions-token.outputs.token }}
          persist-credentials: false

      - name: Create finn-ai-coder GitHub App token
        id: finn-ai-coder-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-issues: write
          permission-pull-requests: write

      - name: Show API budget at the start of finish
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
        run: bash ewa-actions/scripts/show_api_budget.sh finish-start

      - name: Download saved judge result
        if: env.AI_REVIEW_VERSION != '1' && (env.CODEX_VERDICT == 'REQUEST_CHANGES' || env.AI_REVIEW_VERSION == '5') && env.ADMISSION_RESULT == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.shadow-admission.outputs.judge_artifact_name }}
          path: ${{ runner.temp }}/review-judge-result

      - name: Download version 5 review evidence
        if: env.AI_REVIEW_VERSION == '5' && env.CODEX_RESULT == 'success' && env.REVIEW_OVERRIDE_ACTOR == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.codex-direct-cli.outputs.primary_evidence_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/primary-review-artifacts

      - name: Resolve final AI review verdict
        id: verdict
        if: needs.ai-review-check-start.outputs.action == 'run' && env.REVIEW_STOPPED != 'true'
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/code_review/code_review_workflow.py resolve-final-verdict \
            --check-required "$CHECK_REQUIRED" \
            --start-result "$START_RESULT" \
            --run-codex "$RUN_CODEX" \
            --codex-result "$CODEX_RESULT" \
            --codex-verdict "$CODEX_VERDICT" \
            --codex-reason-base64 "$CODEX_REASON_BASE64" \
            --codex-findings-base64 "$CODEX_FINDINGS_BASE64" \
            --codex-full-review "$CODEX_FULL_REVIEW" \
            --review-override-actor "$REVIEW_OVERRIDE_ACTOR" \
            --admission-result "$ADMISSION_RESULT" \
            --admission-classification "$ADMISSION_CLASSIFICATION" \
            --admission-reason-base64 "$ADMISSION_REASON_BASE64" \
            --admission-admitted-findings "$ADMISSION_ADMITTED_FINDINGS" \
            --admission-file "$RUNNER_TEMP/review-judge-result/codex-admission.json" \
            --increment-file "$RUNNER_TEMP/primary-review-artifacts/increment.json" \
            --increment-sha256 "$INCREMENT_SHA256" \
            --anchor-output "$RUNNER_TEMP/review-v5/anchor.json"

      - name: Join the judge's statuses to the earlier must-fix findings
        id: v5-earlier
        if: >-
          env.AI_REVIEW_VERSION == '5' && env.REVIEW_OVERRIDE_ACTOR == '' &&
          (steps.verdict.outputs.final_verdict == 'approved' || steps.verdict.outputs.final_verdict == 'requested_changes')
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/code_review/code_review_v5_threads.py join \
            --open-findings "$RUNNER_TEMP/primary-review-artifacts/open-must-fix.json" \
            --open-findings-sha256 "$OPEN_FINDINGS_SHA256" \
            --statuses "$RUNNER_TEMP/review-judge-result/codex-admission-open-findings.json" \
            --output "$RUNNER_TEMP/review-v5/earlier-findings.json"

      - name: Download ticket description for Jev
        if: env.JEV_ENABLED == 'true' && steps.verdict.outputs.published_findings_base64 != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.codex-direct-cli.outputs.primary_evidence_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/primary-review-artifacts

      - name: Show Jev progress
        id: jev-running-progress
        if: env.JEV_ENABLED == 'true' && steps.verdict.outputs.published_findings_base64 != '' && needs.ai-review-check-start.outputs.progress_comment_id != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROGRESS_COMMENT_ID: ${{ needs.ai-review-check-start.outputs.progress_comment_id }}
          PROGRESS_STATE: ${{ needs.shadow-admission.outputs.progress_state || needs.codex-direct-cli.outputs.progress_state }}
          PROGRESS_UPDATES: "{\"jev\":\"running\"}"
        run: python3 ewa-actions/scripts/code_review/code_review_progress.py

      - name: Decide whether retained findings block with Jev
        id: jev
        if: env.JEV_ENABLED == 'true' && steps.verdict.outputs.published_findings_base64 != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          FINDINGS_BASE64: ${{ steps.verdict.outputs.published_findings_base64 }}
          REVIEW_TICKET_DESCRIPTION_PATH: ${{ runner.temp }}/primary-review-artifacts/ticket-description.txt
          REVIEW_STACK_CONTEXT_PATH: ${{ runner.temp }}/primary-review-artifacts/stack-context.json
        run: python3 ewa-actions/scripts/code_review/code_review_scope.py

      # The Jev requests carry the Jev instructions. Anyone can download a public repository's artifacts.
      - name: Save Jev requests and decisions
        if: steps.jev.outcome == 'success' && env.REPOSITORY_PRIVATE == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ai-review-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-scope/jev-scope.json
          retention-days: 7

      - name: Publish AI review verdict
        id: publish
        if: >-
          ${{
            needs.ai-review-check-start.outputs.action == 'run' &&
            env.REVIEW_STOPPED != 'true' &&
            steps.verdict.outputs.final_verdict != 'skipped'
          }}
        env:
          GH_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_VERDICT: ${{ steps.verdict.outputs.final_verdict }}
          PROVIDER: ${{ steps.verdict.outputs.provider }}
          TITLE: ${{ steps.verdict.outputs.title }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
          FINDINGS_BASE64: ${{ steps.verdict.outputs.published_findings_base64 }}
          SCOPE_REPORT: ${{ env.JEV_ENABLED == 'true' && format('{0}/review-scope/jev-scope.json', runner.temp) || '' }}
          PUBLISHED_MODEL: ${{ needs.resolve-context.outputs.review_override_actor == '' && needs.resolve-context.outputs.codex_model || '' }}
          EARLIER_FINDINGS_FILE: ${{ steps.v5-earlier.outcome == 'success' && format('{0}/review-v5/earlier-findings.json', runner.temp) || '' }}
          MOVED_FINDINGS_BASE64: ${{ steps.verdict.outputs.moved_findings_base64 }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/finn_ai_coder_github_app.py publish-result \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER" \
            --expected-head "$REVIEW_HEAD_SHA" \
            --expected-signature "$REVIEW_DIFF_SIGNATURE" \
            --provider "$PROVIDER" \
            --verdict "$FINAL_VERDICT" \
            --reason "$SUMMARY" \
            --findings-base64 "$FINDINGS_BASE64" \
            --scope-report "$SCOPE_REPORT" \
            --review-version "$AI_REVIEW_VERSION" \
            --earlier-findings-file "$EARLIER_FINDINGS_FILE" \
            --moved-findings-base64 "$MOVED_FINDINGS_BASE64" \
            --baseline-review-id "$BASELINE_REVIEW_ID" \
            --title "$TITLE" \
            --summary "$SUMMARY" \
            --model "$PUBLISHED_MODEL" \
            --review-invocation-id "$REVIEW_INVOCATION_ID" \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --external-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:review"

      # resolveReviewThread needs contents: write for an app token; only the thread step gets that token.
      - name: Create review thread GitHub App token
        id: thread-token
        if: steps.publish.outputs.action == 'published' && steps.v5-earlier.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Version 5: reply on the threads of earlier must-fix findings, and resolve the fixed and the declined ones.
      - name: Answer earlier must-fix finding threads
        if: steps.publish.outputs.action == 'published' && steps.v5-earlier.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.thread-token.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No review thread token; the earlier must-fix finding threads were not updated."
            exit 1
          fi
          python3 ewa-actions/scripts/code_review/code_review_v5_threads.py resolve \
            --earlier-findings "$RUNNER_TEMP/review-v5/earlier-findings.json" \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER"

      - name: Save version 5 publication decisions
        if: always() && env.AI_REVIEW_VERSION == '5' && steps.verdict.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ai-review-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-v5/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Close review check after publication failure
        id: close-after-failure
        if: failure() && steps.finn-ai-coder-token.outputs.token != '' && steps.publish.outputs.action != 'published'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ERROR_PROVIDER: ${{ inputs.review_engine }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/finn_ai_coder_github_app.py publish-result \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER" \
            --expected-head "$REVIEW_HEAD_SHA" \
            --expected-signature "$REVIEW_DIFF_SIGNATURE" \
            --provider "$ERROR_PROVIDER" \
            --verdict error \
            --reason "AI review publication failed. See the workflow run and retry the review." \
            --title "AI review publication failed" \
            --summary "AI review publication failed. See the workflow run and retry the review." \
            --review-invocation-id "$REVIEW_INVOCATION_ID" \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --external-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:review"

      # publish-result reads the PR with github.token first; when that token's hourly budget is spent the step
      # above fails before touching the check. This one needs only the finn-ai-coder app token.
      - name: Close review check with the app token only
        if: failure() && steps.close-after-failure.outcome == 'failure' && steps.finn-ai-coder-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/finn_ai_coder_github_app.py close-check \
            --repo "$GITHUB_REPOSITORY" \
            --head-sha "$REVIEW_HEAD_SHA" \
            --title "AI review publication failed" \
            --summary "AI review publication failed. See the workflow run and retry the review." \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --external-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:review"

      # When this run published no result, the script completes the in-progress review check that this run
      # wrote, so that the check does not stop a later version 4 request. It does nothing before version 4.
      - name: Complete the check of a review without a result
        if: always() && steps.publish.outputs.action != 'published' && steps.finn-ai-coder-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
        run: |
          python3 ewa-actions/scripts/code_review/code_review_running_review.py \
            --repo "$GITHUB_REPOSITORY" \
            --head-sha "$REVIEW_HEAD_SHA" \
            --external-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:review"

      - name: Finish AI review progress acknowledgement
        if: always() && needs.ai-review-check-start.outputs.progress_comment_id != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROGRESS_COMMENT_ID: ${{ needs.ai-review-check-start.outputs.progress_comment_id }}
          PROGRESS_STATE: ${{ steps.jev-running-progress.outputs.progress_state || needs.shadow-admission.outputs.progress_state || needs.codex-direct-cli.outputs.progress_state }}
          PROGRESS_UPDATES: ${{ format('{{"jev":"{0}"}}', steps.jev.outcome == 'success' && 'done' || steps.jev.outcome == 'failure' && 'failed' || 'skipped') }}
          PROGRESS_JEV_REPORT: ${{ steps.jev.outcome == 'success' && format('{0}/review-scope/jev-scope.json', runner.temp) || '' }}
          # A version 5 result for a commit that is no longer the head: the comment names the reviewed commit, or
          # says why the result was not published.
          PROGRESS_REVIEWED_COMMIT: ${{ steps.publish.outputs.newer_head != '' && steps.publish.outputs.head_sha || '' }}
          PROGRESS_STALE_REASON: ${{ steps.publish.outputs.stale_reason }}
          PROGRESS_OUTCOME: ${{ ((env.REVIEW_STOPPED == 'true' || steps.publish.outputs.action == 'stale' || steps.verdict.outputs.final_verdict == 'skipped' || needs.codex-direct-cli.result == 'cancelled' || needs.shadow-admission.result == 'cancelled') && 'skipped') || steps.publish.outputs.final_verdict || 'error' }}
        run: python3 ewa-actions/scripts/code_review/code_review_progress.py

      - name: Write published review telemetry
        if: always() && steps.publish.outputs.action == 'published' && needs.codex-direct-cli.outputs.telemetry != '' && env.TELEMETRY_ENABLED == 'true'
        continue-on-error: true
        env:
          TELEMETRY_REVIEW: ${{ needs.codex-direct-cli.outputs.telemetry }}
          TELEMETRY_ADMISSION: ${{ needs.shadow-admission.outputs.telemetry }}
          FINAL_VERDICT: ${{ steps.publish.outputs.final_verdict }}
          SUPABASE_URL: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 ewa-actions/scripts/code_review/review_telemetry_workflow.py publish

      - name: Write detailed review telemetry
        if: always() && env.TELEMETRY_ENABLED == 'true' && needs.codex-direct-cli.result != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ewa-actions
        env:
          GH_TOKEN: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_REVIEW_TELEMETRY_SUPABASE_SERVICE_ROLE_KEY }}
          # Only this job knows the publish step's action. The collector records 'stale' as the reason a review
          # has no result when GitHub states no other cause, and expects a verdict after 'published'.
          REVIEW_PUBLISH_ACTION: ${{ steps.publish.outputs.action || (env.REVIEW_STOPPED == 'true' && 'stale' || '') }}
        run: >-
          python3 -m scripts.code_review.collect_review_telemetry
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/review-telemetry.json" --write

      # A result for a commit that is no longer the head changes nothing for the new head, so its gate is not rerun.
      - name: Rerun PR metadata gate for published review
        if: steps.publish.outputs.action == 'published' && steps.publish.outputs.newer_head == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          HEAD_REF: ${{ needs.ai-review-check-start.outputs.head_ref }}
        run: |
          set -euo pipefail
          python3 ewa-actions/scripts/finn_ai_coder_github_app.py rerun-metadata-gate \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$TARGET_PR_NUMBER" \
            --head-sha "$PUBLISHED_HEAD_SHA" \
            --head-ref "$HEAD_REF"

      - name: Create breaker analysis GitHub App token
        id: breaker-analysis-token
        if: steps.publish.outputs.evaluate_breaker == 'true' && env.AI_REVIEW_BREAKER_ENABLED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.FINN_AI_CODER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FINN_AI_CODER_GITHUB_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Evaluate and apply AI review circuit breaker
        if: always() && steps.publish.outputs.evaluate_breaker == 'true' && env.AI_REVIEW_BREAKER_ENABLED == 'true'
        uses: ./ewa-actions/.github/actions/code-review-breaker
        with:
          repository: ${{ github.repository }}
          pr-number: ${{ env.TARGET_PR_NUMBER }}
          head-sha: ${{ steps.publish.outputs.head_sha }}
          github-token: ${{ github.token }}
          analysis-github-token: ${{ steps.breaker-analysis-token.outputs.token }}
          app-token: ${{ steps.finn-ai-coder-token.outputs.token }}
          skill-catalog-token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          codex-version: ${{ needs.resolve-context.outputs.codex_version }}
          codex-model: ${{ inputs.review_engine == 'claude' && inputs.codex_model || needs.resolve-context.outputs.codex_model }}
          codex-reasoning-effort: ${{ inputs.review_engine == 'claude' && inputs.codex_reasoning_effort || needs.resolve-context.outputs.codex_reasoning_effort }}

      # A stale AI review result is discarded like a stopped review, not failed: the moved PR waits for its own
      # review. In versions 2 to 4 a result is stale when the PR's head or diff moved after the review read it (a
      # new commit or a base change). A version 5 result is published for the reviewed commit after a new commit;
      # it is stale only when it cannot be placed or trusted (see code_review_reviewed_commit.py). A human override
      # that could not be applied because the head or diff moved still fails, so that its author sees it.
      - name: Fail workflow when AI review is not approved
        if: >-
          ${{
            needs.ai-review-check-start.outputs.action == 'run' &&
            env.REVIEW_STOPPED != 'true' &&
            steps.verdict.outputs.final_verdict != 'skipped' &&
            (
              (steps.publish.outputs.action != 'published' && steps.publish.outputs.action != 'stale') ||
              (
                needs.resolve-context.outputs.review_override_actor != '' &&
                steps.publish.outputs.check_published != 'true'
              ) ||
              (
                steps.verdict.outputs.final_verdict != 'approved' &&
                steps.verdict.outputs.final_verdict != 'requested_changes' &&
                !(
                  steps.verdict.outputs.final_verdict == 'none' &&
                  needs.codex-direct-cli.result == 'success' &&
                  needs.codex-direct-cli.outputs.full_review_performed == 'true' &&
                  needs.codex-direct-cli.outputs.verdict == 'WAIT'
                )
              )
            )
          }}
        env:
          PUBLISH_ACTION: ${{ steps.publish.outputs.action }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
        run: |
          echo "$SUMMARY (publish action: ${PUBLISH_ACTION:-unknown})" >&2
          exit 1

      - name: Show API budget at the end of finish
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.finn-ai-coder-token.outputs.token }}
        run: bash ewa-actions/scripts/show_api_budget.sh finish-end
# yamllint enable rule:line-length
