---
name: AI Label Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - reopened
      - ready_for_review

permissions: {}

jobs:
  ai-assistance-disclosure:
    uses: ./.github/workflows/local-ai-label-check.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
