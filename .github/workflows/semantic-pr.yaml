# This workflow file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
---
name: Semantic Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  validate-pr-title-and-description:
    name: Validate PR Title and Description
    runs-on: finn-runners
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Skip semantic PR validation for Dependabot PR
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: echo "✅ Dependabot PR detected - semantic PR validation skipped for dependency automation."

      - name: Reject chore titles from human authors
        if: >-
          ${{
            github.event.pull_request.user.type != 'Bot' &&
            github.event.pull_request.user.login != 'finn-devops' &&
            (
              startsWith(github.event.pull_request.title, 'chore:') ||
              startsWith(github.event.pull_request.title, 'chore(') ||
              startsWith(github.event.pull_request.title, 'chore!')
            )
          }}
        run: |
          echo "chore is reserved for automation PRs (release tooling, dependency bots)." >&2
          echo "Use a specific type instead: fix, feat, refactor, test, docs, ci, or build." >&2
          exit 1

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        id: validate-title
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        continue-on-error: true
        # yamllint disable rule:line-length
        with:
          # Default types can be found here:
          # https://github.com/commitizen/conventional-commit-types/blob/master/index.json
          # Notes: chore - Kept for bot authors only (release tooling, dependency bots); a separate step rejects chore titles from human authors.
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            release
            revert
            style
            test
          # Reject subjects that start with a second conventional-commit header,
          # e.g. "feat: test: ..." or "fix: feat(scope): ...".
          subjectPattern: "^(?!(?:build|chore|ci|docs|feat|fix|perf|refactor|release|revert|style|test)(?:\\([^)]*\\))?(?:!)?: ).+"
          subjectPatternError: |
            The subject "{subject}" in PR title "{title}" starts with another conventional commit prefix.
            Use a single conventional commit prefix, for example "feat: Add login validation [ENG-123]".
          # yamllint enable rule:line-length
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkout EWA-Actions semantic PR action
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: EWA-Services/EWA-Actions
          ref: main
          path: ewa-actions
          token: ${{ secrets.FINN_DEVOPS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - uses: ./ewa-actions/.github/actions/semantic-pr
        id: validate-description
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Fail when title or description validation fails
        if: >-
          ${{
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            (
              steps.validate-title.outcome == 'failure' ||
              steps.validate-description.outcome == 'failure'
            )
          }}
        run: |
          echo "One or more semantic PR validations failed." >&2
          exit 1
