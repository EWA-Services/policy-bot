# This file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
# Canonical secret scan caller for downstream repositories.
---
name: Secret Scan

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  secret-scan:
    uses: EWA-Services/EWA-Actions/.github/workflows/shareable-secret-scan.yaml@main
    permissions:
      contents: read
      issues: write
    secrets:
      GOOGLE_CHAT_SECURITY_SCAN_SECRET_WEBHOOK: ${{ secrets.GOOGLE_CHAT_SECURITY_SCAN_SECRET_WEBHOOK }}
