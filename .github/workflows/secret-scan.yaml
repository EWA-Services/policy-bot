# Canonical secret scan caller for downstream repositories.
---
name: Secret Scan

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  secret-scan:
    uses: ./.github/workflows/local-secret-scan.yaml
    permissions:
      contents: read
      issues: write
    secrets:
      GOOGLE_CHAT_SECURITY_SCAN_SECRET_WEBHOOK: ${{ secrets.GOOGLE_CHAT_SECURITY_SCAN_SECRET_WEBHOOK }}
