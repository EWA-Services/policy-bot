# This file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
---
# Policy Bot configuration for DevOps/Infrastructure repositories
# These repositories contain critical code requiring
# strict approval processes
policy:
  approval:
    - or:
        - finn-devops bypass no review required
        - platform approver approval
        - platform approver approval without automatic requests
    - Jai or Poom approval for PR size workflow changes
  disapproval:
    requires:
      organizations: [EWA-Services]

approval_rules:
  - name: Jai or Poom approval for PR size workflow changes
    description: Require Jai or Poom to approve changes to the PR size enforcement workflow
    if:
      changed_files:
        paths:
          - ^\.github/workflows/pr-size-gate\.yaml$
    options:
      allow_author: false
      invalidate_on_push: true
    requires:
      count: 1
      users: [jai, poom]

  - name: finn-devops bypass no review required
    description: Allow finn-devops to bypass review requirements
    if:
      targets_branch:
        pattern: ^(main|master|develop|prod)$
      has_author_in:
        users: [finn-devops]
    options:
      allow_author: false
      invalidate_on_push: false
    requires:
      count: 0  # No review requirements for finn-devops
      conditions:
        has_valid_signatures: true
        has_status:
          conclusions: [success]
          statuses:
            - Validate PR Title and Description
            - ai-assistance-disclosure / AI Label Check
            - pre-commit-check
  - name: platform approver approval
    description: Require one platform approver for pull requests to protected branches
    if:
      targets_branch:
        pattern: ^(main|master|develop|prod)$
      title:
        not_matches:
          - "^ci: synced file\\(s\\)"
          - "^chore\\(deps\\): update pinned action SHAs"
          - "^release(?:\\([^)]*\\))?:"
          - ^chore\([^)]*\):.*release.*
          - "^[a-z]+\\(deps(-dev)?\\)!?:"
          - >-
            ^[Bb]ump \S+ from v?\d+(\.\d+)*([+-]\S+)? to v?\d+(\.\d+)*([+-]\S+)?( in /.*)?$
          - >-
            ^[Bb]ump the \S+ group( across [0-9]+ director(y|ies)| in /\S+)? with [0-9]+ updates?$
    options:
      allow_author: false
      invalidate_on_push: false
      request_review:
        enabled: true
        mode: random-users
        count: 1
    requires: &approval_requirements_3
      count: 1
      users: [jai, poom, Sunn-y-Arora, flkas]
      conditions:
        has_valid_signatures: true
        has_status:
          conclusions: [success]
          statuses:
            - Validate PR Title and Description
            - ai-assistance-disclosure / AI Label Check
            - pre-commit-check
        has_workflow_result:
          conclusions: [success, skipped]
          workflows:
            - .github/workflows/pr-size-gate.yaml
  - name: platform approver approval without automatic requests
    description: Retain the approval requirement without automatically requesting reviewers
    if:
      targets_branch:
        pattern: ^(main|master|develop|prod)$
      title:
        not_matches:
          - "^ci: synced file\\(s\\)"
          - "^chore\\(deps\\): update pinned action SHAs"
          - "^release(?:\\([^)]*\\))?:"
          - ^chore\([^)]*\):.*release.*
    options:
      allow_author: false
      invalidate_on_push: false
      request_review:
        enabled: false
    requires: *approval_requirements_3
