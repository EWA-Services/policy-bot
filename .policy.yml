# This file is synchronized from EWA-Services/EWA-Actions
# Do not modify this file directly, all changes will be lost/overwritten
---
# Policy Bot configuration for DevOps/Infrastructure repositories
# These repositories contain critical code requiring
# strict approval processes
policy:
  approval:
    - or:
        - finn-devops bypass no review required
        - dev-infrastructure team approval
  disapproval:
    requires:
      organizations: [EWA-Services]

approval_rules:
  - name: finn-devops bypass no review required
    description: Allow finn-devops to bypass review requirements
    if:
      targets_branch:
        pattern: ^(main|master|develop|prod)$
      has_author_in:
        users: [finn-devops]
    options:
      allow_author: false
      invalidate_on_push: false
    requires:
      count: 0  # No review requirements for finn-devops
      conditions:
        has_valid_signatures: true
        has_status:
          conclusions: [success]
          statuses:
            - Validate PR Title and Description
            - ai-assistance-disclosure / AI Label Check
            - pre-commit-check
  - name: dev-infrastructure team approval
    description: Requires 2 approvals from team for all PRs to main or prod
    if:
      targets_branch:
        pattern: ^(main|master|develop|prod)$
      # Skip this rule (and its request_review) for finn-devops automation PRs.
      # The finn-devops bypass rule above already satisfies the `or` policy
      # for these PRs; matching here too would needlessly tag the human team
      # on every sync/chore/release PR.
      title:
        not_matches:
          - "^ci: synced file\\(s\\)"
          - "^chore\\(deps\\): update pinned action SHAs"
          - "^release(?:\\([^)]*\\))?:"
          - ^chore\([^)]*\):.*release.*
    options:
      allow_author: false
      invalidate_on_push: false
      request_review:
        enabled: true
        mode: teams
    requires:
      count: 2
      teams:
        - EWA-Services/dev-infrastructure
      conditions:
        has_valid_signatures: true
        has_status:
          conclusions: [success]
          statuses:
            - Validate PR Title and Description
            - ai-assistance-disclosure / AI Label Check
            - pre-commit-check
            - Reviewable PR Size
